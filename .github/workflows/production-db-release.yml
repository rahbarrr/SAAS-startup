name: Production database release (manual)

# HUMAN-CONTROLLED. Never runs automatically.
# 1. `plan` job: dry run against production, output goes to the job summary.
# 2. `apply` job: requires approval from the `production` GitHub Environment's required reviewers
#    (owner must configure), then applies migrations and runs post-release verification.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to deploy migrations from (must match v*, e.g. v1.2.0)"
        required: true
      backup_reference:
        description: "Optional external backup/PITR reference. The protected apply job also creates a verified database backup artifact."
        required: false
      rollback_plan:
        description: "Link or short text: forward-fix or restore plan for THESE migrations"
        required: true
      confirm:
        description: "Type APPLY-TO-PRODUCTION to confirm"
        required: true

permissions:
  contents: read

concurrency:
  group: production-db
  cancel-in-progress: false

jobs:
  plan:
    name: Plan (dry run)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production-plan
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.PRODUCTION_SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.PRODUCTION_SUPABASE_DB_PASSWORD }}
      PRODUCTION_PROJECT_REF: ${{ vars.PRODUCTION_SUPABASE_PROJECT_REF }}
    steps:
      - name: Validate inputs
        run: |
          set -euo pipefail
          [ "${{ inputs.confirm }}" = "APPLY-TO-PRODUCTION" ] || { echo "::error::Confirmation text mismatch"; exit 1; }
          echo "${{ inputs.release_tag }}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([-.][A-Za-z0-9.]+)?$' || { echo "::error::release_tag must look like v1.2.3"; exit 1; }
          for v in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD PRODUCTION_PROJECT_REF; do
            if [ -z "${!v}" ]; then echo "::error::Missing required production configuration: $v"; exit 1; fi
          done

      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.release_tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Migration safety lint
        run: node scripts/migration-lint.mjs

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link production project
        run: supabase link --project-ref "$PRODUCTION_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Dry run
        run: |
          {
            echo "## Production migration plan for ${{ inputs.release_tag }}"
            echo "Backup reference: ${{ inputs.backup_reference }}"
            echo "Rollback plan: ${{ inputs.rollback_plan }}"
            echo '```'
            supabase db push --dry-run 2>&1
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  apply:
    name: Apply (requires reviewer approval)
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.PRODUCTION_SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.PRODUCTION_SUPABASE_DB_PASSWORD }}
      PRODUCTION_PROJECT_REF: ${{ vars.PRODUCTION_SUPABASE_PROJECT_REF }}
      PRODUCTION_DB_URL: ${{ secrets.PRODUCTION_DB_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.release_tag }}

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link production project
        run: supabase link --project-ref "$PRODUCTION_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Install PostgreSQL client
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Create and verify pre-release database backup
        id: create_backup
        run: |
          set -euo pipefail
          if [ -z "${PRODUCTION_DB_URL:-}" ]; then
            echo "::error::Missing PRODUCTION_DB_URL secret. No migration has been applied."
            exit 1
          fi
          dump_file="$RUNNER_TEMP/fieldtrack-pre-release.dump"
          listing_file="$RUNNER_TEMP/fieldtrack-pre-release.list"
          umask 077
          pg_dump --format=custom --no-owner --no-acl --file="$dump_file" "$PRODUCTION_DB_URL"
          test -s "$dump_file"
          pg_restore --list "$dump_file" > "$listing_file"
          for table in organizations organization_members profiles organization_invitations; do
            if ! grep -Eq "TABLE public $table([[:space:]]|$)" "$listing_file"; then
              echo "::error::Backup verification failed: required table $table is absent."
              exit 1
            fi
          done
          sha256="$(sha256sum "$dump_file" | cut -d ' ' -f 1)"
          artifact_name="fieldtrack-db-backup-$GITHUB_RUN_ID"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
          {
            echo "## Pre-release database backup verified"
            echo "- Artifact: $artifact_name"
            echo "- SHA-256: $sha256"
            echo "- Format: PostgreSQL custom-format dump"
            echo "- Required tables verified: organizations, organization_members, profiles, organization_invitations"
            echo "- Retention: 7 days; download and preserve securely if a longer retention period is required."
            echo "- External backup reference: ${BACKUP_REFERENCE:-not supplied}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload private pre-release backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: fieldtrack-db-backup-${{ github.run_id }}
          path: ${{ runner.temp }}/fieldtrack-pre-release.dump
          if-no-files-found: error
          retention-days: 7

      - name: Pre-release duplicate invitation check
        run: |
          set -euo pipefail
          duplicates="$(psql "$PRODUCTION_DB_URL" -AtX -v ON_ERROR_STOP=1 <<'SQL'
            select organization_id::text || ':' || lower(invited_email) || ':' || count(*)::text
            from public.organization_invitations
            where status = 'pending'
            group by organization_id, lower(invited_email)
            having count(*) > 1
            order by organization_id, lower(invited_email);
          SQL
          )"
          if [ -n "$duplicates" ]; then
            echo "::error::Pending duplicate invitations exist; resolve them before applying the transactional invitation migration."
            exit 1
          fi

      - name: Apply migrations
        run: supabase db push

      - name: Post-release verification (RLS coverage, required functions)
        run: |
          psql "$PRODUCTION_DB_URL" -v ON_ERROR_STOP=1 -f supabase/verification/post-release.sql

      - name: Record release
        run: |
          {
            echo "## Production DB release applied: ${{ inputs.release_tag }}"
            echo "Verified backup artifact: fieldtrack-db-backup-$GITHUB_RUN_ID"
            echo "Backup SHA-256: ${{ steps.create_backup.outputs.sha256 }}"
            echo "External backup reference: ${{ inputs.backup_reference }}"
            echo "Rollback plan: ${{ inputs.rollback_plan }}"
            echo "Next: complete docs/release-process.md post-deploy smoke checks."
          } >> "$GITHUB_STEP_SUMMARY"
