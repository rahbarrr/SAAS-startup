name: One-time remaining formatting cleanup

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/format-remaining.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Format remaining files
        run: |
          npx prettier --write \
            "apps/mobile/src/__tests__/auth-and-trip-workflow.test.ts" \
            "apps/mobile/src/__tests__/consent-and-queue.test.ts" \
            "apps/mobile/src/App.tsx" \
            "apps/mobile/src/components/GeofenceConsentModal.tsx" \
            "apps/mobile/src/components/GeofenceStatusBanner.tsx" \
            "apps/mobile/src/screens/SignInScreen.tsx" \
            "apps/mobile/src/screens/TripSelectorScreen.tsx" \
            "apps/mobile/src/services/auth.ts" \
            "apps/mobile/src/services/geofencing.ts" \
            "src/components/trips/TripDetailClient.tsx" \
            "src/components/trips/TripPlanForm.tsx" \
            "src/modules/trips/service.ts"
      - name: Commit formatting changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            "apps/mobile/src/__tests__/auth-and-trip-workflow.test.ts" \
            "apps/mobile/src/__tests__/consent-and-queue.test.ts" \
            "apps/mobile/src/App.tsx" \
            "apps/mobile/src/components/GeofenceConsentModal.tsx" \
            "apps/mobile/src/components/GeofenceStatusBanner.tsx" \
            "apps/mobile/src/screens/SignInScreen.tsx" \
            "apps/mobile/src/screens/TripSelectorScreen.tsx" \
            "apps/mobile/src/services/auth.ts" \
            "apps/mobile/src/services/geofencing.ts" \
            "src/components/trips/TripDetailClient.tsx" \
            "src/components/trips/TripPlanForm.tsx" \
            "src/modules/trips/service.ts"
          if git diff --cached --quiet; then
            echo "No formatting changes were needed."
          else
            git commit -m "style: format remaining web and mobile files"
            git push
          fi
