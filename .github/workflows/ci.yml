name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format check (changed files; respect existing baseline)
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_ref="origin/${{ github.base_ref }}"
            diff_range="${base_ref}...HEAD"
          else
            base_ref="${{ github.event.before }}"
            if [[ "$base_ref" =~ ^0+$ ]]; then
              base_ref=""
              diff_range="HEAD"
            else
              diff_range="${base_ref}..HEAD"
            fi
          fi

          if [[ -n "$base_ref" ]]; then
            git fetch origin "${{ github.base_ref || 'main' }}" --depth=1 || true
          fi

          mapfile -d '' changed_files < <(
            if [[ "$diff_range" == "HEAD" ]]; then
              git ls-files -z -- '*.ts' '*.tsx' '*.css' '*.json' '*.mjs' '*.md'
            else
              git diff --name-only -z --diff-filter=ACMRT "$diff_range" -- \
                '*.ts' '*.tsx' '*.css' '*.json' '*.mjs' '*.md'
            fi
          )

          if (( ${#changed_files[@]} == 0 )); then
            echo "No changed files covered by Prettier."
            exit 0
          fi

          checked=()
          for file in "${changed_files[@]}"; do
            if [[ -n "$base_ref" ]] && git cat-file -e "$base_ref:$file" 2>/dev/null; then
              baseline_tmp="$(mktemp --suffix=.${file##*.})"
              git show "$base_ref:$file" > "$baseline_tmp"
              if npx prettier --check "$baseline_tmp" >/dev/null 2>&1; then
                checked+=("$file")
              else
                echo "::warning file=$file::Pre-existing formatting debt on the base branch; not introduced by this change."
              fi
              rm -f "$baseline_tmp"
            else
              checked+=("$file")
            fi
          done

          if (( ${#checked[@]} == 0 )); then
            echo "No changed files with a clean formatting baseline; legacy formatting debt is reported but does not block this change."
            exit 0
          fi

          printf 'Checking changed files with a clean baseline:\n'
          printf ' - %s\n' "${checked[@]}"
          npx prettier --check "${checked[@]}"

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Migration safety lint
        run: npm run lint:migrations

      - name: Unit tests
        run: npm run test:unit

      # In-process PGlite (WASM Postgres): applies every migration and exercises RLS/triggers.
      # No network, no real Supabase project, no secrets.
      - name: Integration tests (PGlite, CI-safe)
        run: npm run test:integration

      - name: Dependency audit (production dependencies, high+)
        run: npm audit --omit=dev --audit-level=high

      # Placeholder, non-secret values only. They are never used to contact a real project.
      - name: Production build
        run: npm run build
        env:
          APP_ENV: development
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-not-a-real-key
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_TELEMETRY_DISABLED: "1"
