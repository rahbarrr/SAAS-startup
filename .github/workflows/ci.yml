name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format check (web and mobile)
        run: |
          npx prettier --check \
            "apps/mobile/src/**/*.{ts,tsx}" \
            "src/**/*.{ts,tsx,css}" \
            "*.{json,mjs,ts,md}"

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Migration safety lint
        run: npm run lint:migrations

      - name: Unit tests
        run: npm run test:unit

      # In-process PGlite (WASM Postgres): applies every migration and exercises RLS/triggers.
      # No network, no real Supabase project, no secrets.
      - name: Integration tests (PGlite, CI-safe)
        run: npm run test:integration

      - name: Dependency audit (production dependencies, high+)
        run: npm audit --omit=dev --audit-level=high

      # Placeholder, non-secret values only. They are never used to contact a real project.
      - name: Production build
        run: npm run build
        env:
          APP_ENV: development
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-not-a-real-key
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_TELEMETRY_DISABLED: "1"
