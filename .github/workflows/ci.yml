name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format check (changed files)
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          changed_files_file="$RUNNER_TEMP/prettier-files"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --name-only -z --diff-filter=ACMRT "${PR_BASE_SHA}...${CURRENT_SHA}" -- '*.ts' '*.tsx' '*.css' '*.json' '*.mjs' '*.md' > "$changed_files_file"
          elif [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            git ls-files -z -- '*.ts' '*.tsx' '*.css' '*.json' '*.mjs' '*.md' > "$changed_files_file"
          else
            git diff --name-only -z --diff-filter=ACMRT "$BEFORE_SHA" "$CURRENT_SHA" -- '*.ts' '*.tsx' '*.css' '*.json' '*.mjs' '*.md' > "$changed_files_file"
          fi
          mapfile -d '' -t changed_files < "$changed_files_file"
          if (("${#changed_files[@]}" == 0)); then
            echo "No Prettier-eligible files changed; skipping format check."
          else
            printf 'Checking formatting for %s changed file(s).\n' "${#changed_files[@]}"
            npx prettier --check "${changed_files[@]}"
          fi

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Migration safety lint
        run: npm run lint:migrations

      - name: Unit tests
        run: npm run test:unit

      # In-process PGlite (WASM Postgres): applies every migration and exercises RLS/triggers.
      # No network, no real Supabase project, no secrets.
      - name: Integration tests (PGlite, CI-safe)
        run: npm run test:integration

      - name: Dependency audit (production dependencies, high+)
        run: npm audit --omit=dev --audit-level=high

      # Placeholder, non-secret values only. They are never used to contact a real project.
      - name: Production build
        run: npm run build
        env:
          APP_ENV: development
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-not-a-real-key
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_TELEMETRY_DISABLED: "1"
