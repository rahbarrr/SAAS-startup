name: Staging database migrations

# Applies migrations to the STAGING Supabase project only (non-production data).
# Production is never touched by this workflow.
on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-db
  cancel-in-progress: false

jobs:
  migrate-staging:
    name: Apply migrations to staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}
      STAGING_PROJECT_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}
    steps:
      - name: Check owner configuration
        run: |
          missing=0
          for v in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD STAGING_PROJECT_REF; do
            if [ -z "${!v}" ]; then echo "::error::Missing required staging configuration: $v"; missing=1; fi
          done
          exit $missing

      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link staging project
        run: supabase link --project-ref "$STAGING_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Dry run (lists pending migrations)
        run: supabase db push --dry-run

      - name: Apply
        run: supabase db push
