name: Temporary Prettier Auto-fix

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "*.json"
      - "*.mjs"
      - "*.ts"
      - "*.md"
      - ".github/workflows/temporary-prettier-fix.yml"

permissions:
  contents: write

jobs:
  format:
    if: ${{ !startsWith(github.event.head_commit.message, 'style: auto-format sources') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format source files
        run: npm run format

      - name: Commit formatter-only changes to main
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "style: auto-format sources"
          git push origin HEAD:main
