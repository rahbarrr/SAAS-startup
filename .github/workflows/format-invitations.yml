name: One-time invitation formatting cleanup

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/format-invitations.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Format invitation files
        run: npx prettier --write "src/components/team/InviteMemberPanel.tsx" "src/modules/auth/invitation-email.ts"
      - name: Commit formatting changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "src/components/team/InviteMemberPanel.tsx" "src/modules/auth/invitation-email.ts"
          if git diff --cached --quiet; then
            echo "No formatting changes were needed."
          else
            git commit -m "style: format invitation workflow files"
            git push
          fi
